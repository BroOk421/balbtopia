name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm ci

      - name: Write online config from GitHub Secrets
        run: node scripts/make-config.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Copy the game into the Android project
        run: npx cap sync android

      # the fixed signing key (GitHub Secrets), so every new APK updates the installed app instead of failing
      - name: Signing key from GitHub Secrets
        env:
          BALB_KEYSTORE_B64: ${{ secrets.BALB_KEYSTORE_B64 }}
        run: |
          if [ -n "$BALB_KEYSTORE_B64" ]; then
            printf '%s' "$BALB_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/balb.jks"
            echo "BALB_KEYSTORE=$RUNNER_TEMP/balb.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::BALB_KEYSTORE_B64 secret missing: the APK gets a random key and won't update over the installed app"
          fi

      # prints only sizes/fingerprints (no secrets) so a wrong secret is easy to spot
      - name: Check signing key
        if: env.BALB_KEYSTORE != ''
        env:
          P: ${{ secrets.BALB_KEYSTORE_PASSWORD }}
          KP: ${{ secrets.BALB_KEY_PASSWORD }}
          A: ${{ secrets.BALB_KEY_ALIAS }}
        run: |
          P="${P//[$'\t\r\n ']/}"; KP="${KP//[$'\t\r\n ']/}"; A="${A//[$'\t\r\n ']/}"
          echo "keystore: $(stat -c %s "$BALB_KEYSTORE") bytes, sha256 starts $(sha256sum "$BALB_KEYSTORE" | cut -c1-12)"
          echo "lengths: store password ${#P}, key password ${#KP}, alias ${#A}"
          if ! keytool -list -keystore "$BALB_KEYSTORE" -storepass "$P" > /dev/null 2>&1; then
            echo "::error::BALB_KEYSTORE_PASSWORD does not open the keystore in BALB_KEYSTORE_B64 (they come from different keys, or the password was pasted wrong)"
            exit 1
          fi
          if ! keytool -list -keystore "$BALB_KEYSTORE" -storepass "$P" -alias "$A" > /dev/null 2>&1; then
            echo "::error::BALB_KEY_ALIAS not found in the keystore"
            keytool -list -keystore "$BALB_KEYSTORE" -storepass "$P" | grep -i entry
            exit 1
          fi
          echo "signing key OK"

      - name: Build debug APK
        env:
          BALB_KEYSTORE_PASSWORD: ${{ secrets.BALB_KEYSTORE_PASSWORD }}
          BALB_KEY_ALIAS: ${{ secrets.BALB_KEY_ALIAS }}
          BALB_KEY_PASSWORD: ${{ secrets.BALB_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: balbtopia-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
