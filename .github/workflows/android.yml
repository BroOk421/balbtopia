name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# (Nov 23 2026) contents: write = the build may update the "latest-apk" release (last step)
permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm ci

      # (Nov 23 2026) the APK's www/ knows its build (GITHUB_SHA) and where updates come from (OTA_BASE: the GitHub
      # Pages site, worked out from the repo name; set a repo variable OTA_BASE for a custom domain): bootflow.js
      - name: Write online config from GitHub Secrets
        run: node scripts/make-config.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OTA_BASE: ${{ vars.OTA_BASE }}

      - name: Copy the game into the Android project
        run: npx cap sync android

      # the fixed signing key (GitHub Secrets), so every new APK updates the installed app instead of failing
      - name: Signing key from GitHub Secrets
        env:
          BALB_KEYSTORE_B64: ${{ secrets.BALB_KEYSTORE_B64 }}
        run: |
          if [ -n "$BALB_KEYSTORE_B64" ]; then
            printf '%s' "$BALB_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/balb.jks"
            echo "BALB_KEYSTORE=$RUNNER_TEMP/balb.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::BALB_KEYSTORE_B64 secret missing: the APK gets a random key and won't update over the installed app"
          fi

      # prints only sizes/fingerprints (no secrets) so a wrong secret is easy to spot
      - name: Check signing key
        if: env.BALB_KEYSTORE != ''
        env:
          P: ${{ secrets.BALB_KEYSTORE_PASSWORD }}
          KP: ${{ secrets.BALB_KEY_PASSWORD }}
          A: ${{ secrets.BALB_KEY_ALIAS }}
        run: |
          P="${P//[$'\t\r\n ']/}"; KP="${KP//[$'\t\r\n ']/}"; A="${A//[$'\t\r\n ']/}"
          echo "keystore: $(stat -c %s "$BALB_KEYSTORE") bytes, sha256 starts $(sha256sum "$BALB_KEYSTORE" | cut -c1-12)"
          echo "lengths: store password ${#P}, key password ${#KP}, alias ${#A}"
          if ! keytool -list -keystore "$BALB_KEYSTORE" -storepass "$P" > /dev/null 2>&1; then
            echo "::error::BALB_KEYSTORE_PASSWORD does not open the keystore in BALB_KEYSTORE_B64 (they come from different keys, or the password was pasted wrong)"
            exit 1
          fi
          if ! keytool -list -keystore "$BALB_KEYSTORE" -storepass "$P" -alias "$A" > /dev/null 2>&1; then
            echo "::error::BALB_KEY_ALIAS not found in the keystore"
            keytool -list -keystore "$BALB_KEYSTORE" -storepass "$P" | grep -i entry
            exit 1
          fi
          echo "signing key OK"

      - name: Build debug APK
        env:
          BALB_KEYSTORE_PASSWORD: ${{ secrets.BALB_KEYSTORE_PASSWORD }}
          BALB_KEY_ALIAS: ${{ secrets.BALB_KEY_ALIAS }}
          BALB_KEY_PASSWORD: ${{ secrets.BALB_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: balbtopia-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # (owner, Nov 23 2026: "on the phone the download apk doesn't show on GitHub, on the PC it does") an artifact can
      # only be downloaded when signed in to GitHub, and it comes zipped. The same APK also goes to the release
      # "latest-apk" (replaced on every build): one fixed link, no sign-in needed (public repo), a plain .apk:
      #   https://github.com/<owner>/<repo>/releases/download/latest-apk/balbtopia.apk
      - name: Publish the APK to the "latest-apk" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk balbtopia.apk
          NOTES="Build ${GITHUB_SHA::7} ($(date -u '+%Y-%m-%d %H:%M UTC')). Download balbtopia.apk below and open it on your phone."
          if gh release view latest-apk > /dev/null 2>&1; then
            gh release upload latest-apk balbtopia.apk --clobber
            gh release edit latest-apk --notes "$NOTES" --latest
          else
            gh release create latest-apk balbtopia.apk --title "Balbtopia APK (latest)" --notes "$NOTES" --latest
          fi
          echo "APK link: https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-apk/balbtopia.apk" >> "$GITHUB_STEP_SUMMARY"
