name: Web version (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# (Nov 24 2026) Two jobs, both Pages actions on v5: upload-pages-artifact v3 + deploy-pages v4 (Node 20, now forced onto
# Node 24) failed with "Found 0 artifact(s)", and deploy-pages run in the SAME job a fraction of a second after the
# upload can also miss the fresh artifact. The deploy job starts only after the build job has finished uploading.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      # (Nov 23 2026) WEB_BUILD / WEB_TIME / OTA_BASE too: the phone app updates itself from this site (bootflow.js)
      - name: Write online config from GitHub Secrets
        run: node scripts/make-config.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OTA_BASE: ${{ vars.OTA_BASE || format('{0}/', steps.pages.outputs.base_url) }}
      - name: Update list for the phone app (www/ota/manifest.json)
        run: node scripts/make-ota.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
